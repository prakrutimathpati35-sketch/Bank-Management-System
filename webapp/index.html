<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Bank Management System</title>
</head>

<body style="
    margin: 0;
    padding: 0;
    font-family: Arial, sans-serif;
    background: linear-gradient(135deg, #e3f2fd, #bbdefb);
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
">

    <div style="
        width: 450px;
        background: white;
        padding: 45px;
        border-radius: 20px;
        text-align: center;
        box-shadow: 0 10px 30px rgba(0,0,0,0.15);
    ">

        <div style="
            width: 80px;
            height: 80px;
            margin: 0 auto 20px;
            border-radius: 50%;
            background: linear-gradient(135deg, #1565c0, #42a5f5);
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 38px;
        ">
            🏦
        </div>

        <h1 style="
            color: #0d47a1;
            margin-bottom: 10px;
            font-size: 30px;
        ">
            Bank Management System
        </h1>

        <p style="
            color: #777;
            font-size: 16px;
            margin-bottom: 35px;
        ">
            Secure and simple banking at your fingertips
        </p>

        <div style="
            display: flex;
            flex-direction: column;
            gap: 15px;
        ">

            <a href="login.html" style="
                display: block;
                padding: 14px;
                background: #1565c0;
                color: white;
                text-decoration: none;
                border-radius: 8px;
                font-size: 16px;
                font-weight: bold;
            ">
                🔐 Login
            </a>

            <a href="signup.html" style="
                display: block;
                padding: 14px;
                background: white;
                color: #1565c0;
                text-decoration: none;
                border: 2px solid #1565c0;
                border-radius: 8px;
                font-size: 16px;
                font-weight: bold;
            ">
                📝 Create New Account
            </a>
            

        </div>

        <p style="
            margin-top: 35px;
            color: #999;
            font-size: 13px;
        ">
            © 2026 Bank Management System
        </p>

    </div>

</body>
</html>
