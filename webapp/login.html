<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <title>Bank Login</title>
</head>

<body style="
    margin: 0;
    padding: 0;
    min-height: 100vh;
    font-family: Arial, sans-serif;
    background: linear-gradient(135deg, #e3f2fd, #bbdefb);
    display: flex;
    justify-content: center;
    align-items: center;
">

    <div style="
        width: 400px;
        background: white;
        padding: 40px;
        border-radius: 20px;
        box-shadow: 0 10px 30px rgba(0,0,0,0.15);
    ">

        <!-- Bank Icon -->

        <div style="
            width: 75px;
            height: 75px;
            margin: 0 auto 20px;
            border-radius: 50%;
            background: linear-gradient(135deg, #1565c0, #42a5f5);
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 35px;
        ">
            🏦
        </div>

        <!-- Heading -->

        <h1 style="
            text-align: center;
            color: #0d47a1;
            margin: 0;
            font-size: 28px;
        ">
            Welcome Back
        </h1>

        <p style="
            text-align: center;
            color: #777;
            font-size: 14px;
            margin-bottom: 30px;
        ">
            Login to your bank account
        </p>


        <!-- Login Form -->

        <form action="LoginServ" method="post">

            <!-- Email -->

            <label style="
                display: block;
                margin-bottom: 7px;
                color: #333;
                font-weight: bold;
                font-size: 14px;
            ">
                Email
            </label>

            <input type="email"
                   name="email"
                   placeholder="Enter your email"
                   required
                   style="
                       width: 100%;
                       padding: 13px;
                       margin-bottom: 20px;
                       border: 1px solid #ccc;
                       border-radius: 8px;
                       box-sizing: border-box;
                       font-size: 14px;
                   ">


            <!-- Password -->

            <label style="
                display: block;
                margin-bottom: 7px;
                color: #333;
                font-weight: bold;
                font-size: 14px;
            ">
                Password
            </label>

            <input type="password"
                   name="password"
                   placeholder="Enter your password"
                   required
                   style="
                       width: 100%;
                       padding: 13px;
                       margin-bottom: 25px;
                       border: 1px solid #ccc;
                       border-radius: 8px;
                       box-sizing: border-box;
                       font-size: 14px;
                   ">


            <!-- Login Button -->

            <button type="submit"
                    style="
                        width: 100%;
                        padding: 14px;
                        border: none;
                        border-radius: 8px;
                        background: linear-gradient(
                            135deg,
                            #1565c0,
                            #1976d2
                        );
                        color: white;
                        font-size: 16px;
                        font-weight: bold;
                        cursor: pointer;
                    ">
                🔐 Login
            </button>

        </form>


        <!-- Signup -->

        <p style="
            text-align: center;
            margin-top: 25px;
            color: #777;
            font-size: 14px;
        ">
            Don't have an account?

            <a href="signup.html"
               style="
                   color: #1565c0;
                   text-decoration: none;
                   font-weight: bold;
               ">
                Create Account
            </a>
        </p>


        <!-- Back to Home -->

        <div style="
            text-align: center;
            margin-top: 15px;
        ">

            <a href="index.html"
               style="
                   color: #777;
                   text-decoration: none;
                   font-size: 13px;
               ">
                ← Back to Home
            </a>

        </div>

    </div>

</body>

</html>
